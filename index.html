<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DPS WizzGeeks — Question Bank</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['\\(', '\\)'], ['$', '$']],
        displayMath: [['\\[', '\\]'], ['$$', '$$']]
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-slate-100 text-slate-800 antialiased">

  <header class="sticky top-0 z-20 bg-white/90 backdrop-blur border-b border-slate-200 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center gap-3">
      <div class="flex items-center gap-2">
        <div class="w-9 h-9 rounded-lg bg-indigo-600 text-white flex items-center justify-center font-bold text-lg">Q</div>
        <div>
          <h1 class="text-lg font-bold leading-tight">Question Bank</h1>
          <p class="text-xs text-slate-500 leading-tight">
            <span id="count-label">Loading…</span>
          </p>
        </div>
      </div>

      <nav id="subject-tabs" class="flex rounded-lg overflow-hidden border border-slate-300 ml-auto">
        <button data-subject="math" class="subject-btn px-5 py-1.5 text-sm font-semibold">Maths</button>
        <button data-subject="phy" class="subject-btn px-5 py-1.5 text-sm font-semibold">Physics</button>
      </nav>

      <div class="w-full lg:w-auto lg:flex-1 lg:max-w-md">
        <input id="search-input" type="search" placeholder="Search questions…"
               class="w-full rounded-lg border border-slate-300 px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      </div>
    </div>
  </header>

  <div class="max-w-7xl mx-auto px-4 py-4 lg:flex lg:gap-6">

    <button id="filter-toggle" class="lg:hidden mb-3 w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm font-semibold">
      Filters
    </button>

    <aside id="sidebar" class="hidden lg:block w-72 shrink-0 space-y-5">
      <section id="chapter-section" class="bg-white rounded-xl border border-slate-200 p-4">
        <div class="flex items-center justify-between mb-2">
          <h2 class="text-sm font-bold text-slate-700">Chapters</h2>
          <button id="clear-chapters" class="text-xs text-indigo-600 hover:underline">Clear</button>
        </div>
        <div id="chapter-list" class="space-y-1 max-h-[55vh] overflow-y-auto pr-1"></div>
      </section>

      <section class="bg-white rounded-xl border border-slate-200 p-4">
        <h2 class="text-sm font-bold text-slate-700 mb-2">Question Type</h2>
        <div id="type-list" class="flex flex-wrap gap-1.5"></div>
      </section>

      <section class="bg-white rounded-xl border border-slate-200 p-4">
        <label class="text-sm font-bold text-slate-700 block mb-2" for="category-select">Category</label>
        <select id="category-select" class="w-full rounded-lg border border-slate-300 px-2 py-1.5 text-sm"></select>
      </section>

      <section class="bg-white rounded-xl border border-slate-200 p-4">
        <label class="text-sm font-bold text-slate-700 block mb-2" for="difficulty-select">Difficulty</label>
        <select id="difficulty-select" class="w-full rounded-lg border border-slate-300 px-2 py-1.5 text-sm"></select>
      </section>
    </aside>

    <main class="flex-1 min-w-0">
      <div id="result-info" class="text-sm text-slate-600 mb-3 px-1"></div>
      <div id="question-list" class="space-y-4"></div>

      <div id="pagination" class="flex items-center justify-center gap-3 mt-6 pb-10"></div>
    </main>
  </div>

  <script src="data/questions-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
